services:
  - type: web
    name: artistdirect
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Adaugă celelalte variabile de mediu în dashboard-ul Render
      # DB_USER, DB_HOST, DB_PASSWORD, DB_NAME, DB_PORT
      # SESSION_SECRET
      # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
      # OAUTH_CALLBACK_URL


